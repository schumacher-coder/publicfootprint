# Nginx Config: Alias Domain Redirects
# Location: /etc/nginx/sites-available/footprint-alias-redirects

# publicfootprint.de (ohne Bindestrich) → public-footprint.de
server {
    listen 80;
    listen [::]:80;
    server_name publicfootprint.de www.publicfootprint.de;

    return 301 https://public-footprint.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name publicfootprint.de www.publicfootprint.de;

    # SSL Zertifikat (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/publicfootprint.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/publicfootprint.de/privkey.pem;

    return 301 https://public-footprint.de$request_uri;
}

# public-footprint.com (.com statt .de) → public-footprint.de
server {
    listen 80;
    listen [::]:80;
    server_name public-footprint.com www.public-footprint.com;

    return 301 https://public-footprint.de$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name public-footprint.com www.public-footprint.com;

    # SSL Zertifikat (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/public-footprint.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/public-footprint.com/privkey.pem;

    return 301 https://public-footprint.de$request_uri;
}

