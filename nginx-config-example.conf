# ============================================================================
# Nginx Configuration for Public Footprint Multi-Domain Setup
#
# This file contains configuration for all 7 domains.
# Each domain runs the same Next.js application on different URLs.
#
# Installation:
#   1. Copy this file for each domain:
#      sudo nano /etc/nginx/sites-available/publicfootprint.de
#      sudo nano /etc/nginx/sites-available/reference-footprint.de
#      ... etc
#
#   2. Enable sites:
#      sudo ln -s /etc/nginx/sites-available/publicfootprint.de /etc/nginx/sites-enabled/
#      sudo ln -s /etc/nginx/sites-available/reference-footprint.de /etc/nginx/sites-enabled/
#      ... etc
#
#   3. Test configuration:
#      sudo nginx -t
#
#   4. Reload Nginx:
#      sudo systemctl reload nginx
#
#   5. Get SSL certificates:
#      sudo certbot --nginx -d publicfootprint.de -d www.publicfootprint.de
#      sudo certbot --nginx -d reference-footprint.de -d www.reference-footprint.de
#      ... etc
#
# ============================================================================

# ============================================================================
# 1. publicfootprint.de (Main Domain)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name publicfootprint.de www.publicfootprint.de;

    # Redirect to HTTPS (will be configured by Certbot)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

