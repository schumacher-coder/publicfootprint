# ============================================================================
# Notes:
# ============================================================================
#
# All domains point to the same Next.js app (port 3000).
# Next.js handles domain-specific routing via request headers.
#
# SSL Configuration:
# - Run certbot for each domain to get SSL certificates
# - Certbot will automatically modify these configs and add HTTPS blocks
#
# DNS Configuration (at Ionos):
# For each domain, add these A-Records:
#   @ → <VPS-IP>
#   www → <VPS-IP>
#
# Testing:
#   curl -H "Host: publicfootprint.de" http://localhost:3000
#   curl -H "Host: reference-footprint.de" http://localhost:3000
#
# PM2 Logs:
#   pm2 logs publicfootprint
#
# Nginx Logs:
#   tail -f /var/log/nginx/access.log
#   tail -f /var/log/nginx/error.log
#
# ============================================================================
